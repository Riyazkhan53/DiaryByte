# Builds the DiaryByte Wear OS watch app (wear/) and publishes the APK as the
# "Wear OS app (latest)" GitHub release, so it can be downloaded on the phone
# and installed on the watch. Runs when wear/ changes on main, or by hand:
# GitHub app → Actions → Build Wear OS app → Run workflow.
name: Build Wear OS app

on:
  push:
    paths:
      - 'wear/**'
      - '.github/workflows/wear-build.yml'
  workflow_dispatch:
    inputs:
      server:
        description: 'DiaryByte server address (blank = default)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: wear-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        env:
          SERVER: ${{ inputs.server || vars.DIARYBYTE_SERVER }}
        run: |
          ARGS=""
          if [ -n "$SERVER" ]; then ARGS="-PdiarybyteServer=$SERVER"; fi
          gradle -p wear --no-daemon assembleRelease $ARGS
          cp wear/app/build/outputs/apk/release/app-release.apk DiaryByte-Wear.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DiaryByte-Wear
          path: DiaryByte-Wear.apk

      # Only from main: replace the "wear-latest" release's APK.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wear-latest --yes --cleanup-tag || true
          gh release create wear-latest DiaryByte-Wear.apk \
            --title "Wear OS app (latest)" \
            --notes "DiaryByte for Wear OS, build ${{ github.run_number }} ($(git rev-parse --short HEAD)). Download DiaryByte-Wear.apk on your phone and install it on the watch (see wear/README.md)." \
            --latest=false
