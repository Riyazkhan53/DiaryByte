services:
  - type: web
    name: diarybyte
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # SPA fallback — serve index.html for all routes so Expo Router
      # paths like /diary or /movies don't 404 on refresh or direct visit
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
